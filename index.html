<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up Page</title>
    <link rel="stylesheet" href="login_style.css">
</head>

<body>

    <div class="form-container">

        <h2 id="formTitle">Login</h2>

        <form id="authForm">

            <label for="username">Username</label>
            <input type="text" id="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" required>

            <!-- Show Password Checkbox (only for Login) -->
            <div class="show-password" id="showPasswordContainer">
                <input type="checkbox" id="showPassword"
                    onclick="togglePasswordVisibility()">
                <label for="showPassword">Show Password</label>
            </div>

            <!-- Confirm Password Field for Sign-Up -->
            <label for="confirmPassword" id="confirmPasswordLabel"
                style="display: none;">
                Confirm Password
            </label>

            <input type="password" id="confirmPassword"
                style="display: none;">

            <!-- Password Match Message -->
            <p id="passwordMatchMessage"
                style="font-size: 14px; color: rgb(248, 140, 189); display: none;">
            </p>

            <button type="button" onclick="handleSubmit()">Login</button>

            <p id="errorMessage"></p>

            <!-- Toggle Link -->
            <p id="toggleText">
                Don't have an account?
                <a href="#" onclick="toggleForm(); return false;">Sign Up</a>
            </p>

        </form>

    </div>

    <!-- Embedded JavaScript -->
    <script>

        let isLogin = true;

        // Function to switch between Login and Sign-Up
        function toggleForm() {

            const formTitle = document.getElementById('formTitle');
            const confirmPassword = document.getElementById('confirmPassword');
            const confirmPasswordLabel = document.getElementById('confirmPasswordLabel');
            const submitButton = document.querySelector('button');
            const toggleText = document.getElementById('toggleText');
            const showPasswordContainer = document.getElementById('showPasswordContainer');
            const passwordMatchMessage = document.getElementById('passwordMatchMessage');

            // Clear form fields when toggling
            document.getElementById('authForm').reset();

            // Clear error and password match messages
            document.getElementById('errorMessage').textContent = '';
            passwordMatchMessage.style.display = 'none';

            if (isLogin) {

                // Switch to Sign-Up form
                formTitle.textContent = 'Sign Up';

                confirmPassword.style.display = 'block';
                confirmPasswordLabel.style.display = 'block';

                // Make confirm password required
                confirmPassword.required = true;

                submitButton.textContent = 'Sign Up';

                toggleText.innerHTML =
                    'Already have an account? <a href="#" onclick="toggleForm(); return false;">Login</a>';

                showPasswordContainer.style.visibility = 'hidden';

                isLogin = false;

            } else {

                // Switch to Login form
                formTitle.textContent = 'Login';

                confirmPassword.style.display = 'none';
                confirmPasswordLabel.style.display = 'none';

                // Remove required attribute when hidden
                confirmPassword.required = false;

                submitButton.textContent = 'Login';

                toggleText.innerHTML =
                    'Don\'t have an account? <a href="#" onclick="toggleForm(); return false;">Sign Up</a>';

                showPasswordContainer.style.visibility = 'visible';

                isLogin = true;
            }
        }


        // Function to handle Login and Sign-Up
        function handleSubmit() {

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            // Clear previous error message
            errorMessage.textContent = '';

            if (isLogin) {

                // Login Process
                const storedUsername = localStorage.getItem('username');
                const storedPassword = localStorage.getItem('password');

                if (username === storedUsername && password === storedPassword) {

                    alert('Welcome! Successfully logged in.');

                    // Redirect to home page
                    window.location.href = 'index.html';

                } else {

                    errorMessage.textContent = 'Invalid username or password';

                }

            } else {

                // Sign-Up Process
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (!username || !password || !confirmPassword) {

                    errorMessage.textContent = 'Please fill out all fields';

                } else if (password !== confirmPassword) {

                    errorMessage.textContent = 'Passwords do not match';

                } else {

                    // Save account information
                    localStorage.setItem('username', username);
                    localStorage.setItem('password', password);

                    alert('Account created successfully! You can now log in.');

                    // Reset form
                    document.getElementById('authForm').reset();

                    // Switch back to Login form
                    toggleForm();

                }

            }
        }


        // Function to Show or Hide Password
        function togglePasswordVisibility() {

            const passwordField = document.getElementById('password');

            if (passwordField.type === 'password') {

                passwordField.type = 'text';

            } else {

                passwordField.type = 'password';

            }
        }


        // Check password matching while typing
        document.getElementById('confirmPassword').addEventListener('input', checkPasswordMatch);

        document.getElementById('password').addEventListener('input', checkPasswordMatch);


        function checkPasswordMatch() {

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const message = document.getElementById('passwordMatchMessage');

            if (confirmPassword === "") {

                message.style.display = 'none';

            } else if (confirmPassword === password) {

                message.textContent = 'Passwords match';
                message.style.color = 'green';
                message.style.display = 'block';

            } else {

                message.textContent = 'Passwords do not match';
                message.style.color = 'red';
                message.style.display = 'block';

            }
        }

    </script>

</body>
</html>
